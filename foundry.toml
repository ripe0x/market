[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Remappings are part of every contract's metadata, so they change bytecode and CREATE2
# addresses. Auto-detection would add remappings for whatever nested submodules happen to be
# checked out (`--recursive` adds OpenZeppelin's test dependencies), so the list is fixed here.
auto_detect_remappings = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[lint]
lint_on_build = false
